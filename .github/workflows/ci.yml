name: CI
on:
  # No branch filter on pull_request on purpose: a stacked PR targets its base, not main, and
  # filtering on main would leave exactly those PRs with no checks at all.
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned rather than latest: this repo is a reference implementation, so a reader who
          # copies it should get the toolchain the tests were verified on.
          bun-version: 1.2.10
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test

  # Its own job because example-eve-agent is outside the Bun workspace: eve needs npm and Node 24.
  # --no-workspaces on both, or npm walks up and installs the repo root instead.
  eve:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: example-eve-agent
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: example-eve-agent/package-lock.json
      - run: npm ci --no-workspaces
      - run: npm run typecheck --no-workspaces
      # Not redundant with typecheck: it passed a channel that could not be imported at all.
      - run: npm test --no-workspaces
      # The only check that catches an illegal channel or tool filename: discovery runs at build.
      - run: npm run build --no-workspaces
